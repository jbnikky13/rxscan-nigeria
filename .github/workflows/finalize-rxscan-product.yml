name: Finalize RxScan Product

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Finalize RxScan product integration') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rxscan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rxscan/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Apply final product integration
        run: node scripts/finalize-product.js

      - name: Production build validation
        run: npm run build

      - name: Commit integration changes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rxscan/src/App.tsx rxscan/scripts/finalize-product.js
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "Finalize RxScan product integration"
            git push origin HEAD:main
          fi
