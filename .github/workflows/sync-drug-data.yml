name: RxScan authoritative drug data sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rxscan
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      MAX_MEDICINES: '1000'
      MAX_INTERACTION_PAIRS: '500'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL repository secret"; exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY repository secret"; exit 1)
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL repository secret"; exit 1)
          test -n "$NCBI_EMAIL" || (echo "Missing NCBI_EMAIL repository secret"; exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rxscan/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Poppler and PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y poppler-utils postgresql-client

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        run: |
          cd ..
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Sync authoritative data
        run: npm run sync:drug-data
