name: Ingest authoritative RxScan data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 0'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      PUBMED_MAX_PAIRS: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rxscan/package-lock.json
      - name: Install app dependencies
        working-directory: rxscan
        run: npm ci
      - name: Install ingestion dependencies
        run: python -m pip install -r requirements-ingestion.txt
      - name: Ingest RxNorm
        run: node scripts/ingest-rxnorm.mjs
      - name: Ingest Nigeria Essential Medicines List
        run: python scripts/ingest-neml.py
      - name: Ingest PubMed evidence
        run: node scripts/ingest-pubmed.mjs
      - name: Verify authoritative tables
        run: node scripts/verify-authoritative-data.mjs
